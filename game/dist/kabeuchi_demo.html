<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>没入書庫</title>
<style>
/* 没入書庫 共通テーマ
   単一テーマ（暗）で全色を明示的に塗る。ホスト側の配色に依存しない。 */

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --ink0: #060a12;      /* 機構: 地 */
  --ink1: #0c1322;      /* 機構: パネル */
  --ink2: #16203a;      /* 機構: 境界 */
  --tx:   #c7d2e0;      /* 機構: 本文 */
  --tx-dim: #6b7a90;    /* 機構: 弱 */
  --cyan: #5fd4e8;      /* 機構: データ */
  --amber:#e0b060;      /* 機構: 警告・貢献度 */
  --red:  #e05d5d;      /* 観測ドット */
  --kabe-bg: #000000;   /* 壁打ち: 地 */
  --kabe-tx: #c9c2b6;   /* 壁打ち: 本文（暖灰） */
  --kabe-dim:#6e6a62;
  --mono: "SFMono-Regular", ui-monospace, "Cascadia Mono", Menlo, Consolas, "Courier New", monospace;
  --sans: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", YuGothic, Meiryo, sans-serif;
}

html, body { height: 100%; }

body {
  background: var(--ink0);
  color: var(--tx);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.9;
  transition: background .6s ease, color .6s ease;
  overflow: hidden;
}

#app {
  height: 100%;
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
}

/* ---------- HUD ---------- */

#hud {
  flex: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 16px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .12em;
  color: var(--tx-dim);
  border-bottom: 1px solid var(--ink2);
  user-select: none;
  transition: opacity .6s ease;
}
#hud .obs { color: var(--red); display: flex; align-items: center; gap: 6px; }
#hud .obs::before {
  content: "";
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--red);
  animation: pulse 2.2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }

/* ---------- 流れ（本文） ---------- */

#stage { flex: 1; display: flex; flex-direction: column; min-height: 0; }

#game { flex: 1; display: flex; flex-direction: column; min-height: 0; }
#game[hidden] { display: none; }

#flow {
  flex: 1;
  overflow-y: auto;
  padding: 26px 20px 18px;
  -webkit-overflow-scrolling: touch;
}
#flow::-webkit-scrollbar { width: 0; }

.line { margin-bottom: 1.15em; word-break: break-word; }
.line.nar { color: var(--tx); }
.line.say { color: var(--tx); }
.line.sys {
  font-family: var(--mono);
  font-size: 13.5px;
  color: var(--cyan);
  background: var(--ink1);
  border: 1px solid var(--ink2);
  border-left: 2px solid var(--cyan);
  padding: 9px 12px;
  letter-spacing: .04em;
}
.line.me {
  color: var(--amber);
  text-align: right;
  font-size: 14px;
}
.line.faint { color: var(--tx-dim); font-size: 13.5px; }

.cue {
  color: var(--tx-dim);
  font-size: 11px;
  font-family: var(--mono);
  animation: pulse 1.6s ease-in-out infinite;
  margin-top: -.6em;
  margin-bottom: 1em;
}

/* ---------- 操作欄 ---------- */

#controls {
  flex: none;
  padding: 12px 20px 22px;
  display: flex;
  flex-direction: column;
  gap: 9px;
}

button.ch {
  font-family: inherit;
  font-size: 14.5px;
  line-height: 1.6;
  text-align: left;
  color: var(--tx);
  background: var(--ink1);
  border: 1px solid var(--ink2);
  padding: 12px 14px;
  cursor: pointer;
  transition: border-color .18s ease, background .18s ease;
}
button.ch:hover, button.ch:focus-visible { border-color: var(--cyan); outline: none; }
button.ch:focus-visible { box-shadow: 0 0 0 1px var(--cyan); }

/* ---------- 情動ログ ---------- */

.diary {
  background: var(--ink1);
  border: 1px solid var(--ink2);
  padding: 14px;
}
.diary .dlabel {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .12em;
  color: var(--cyan);
  margin-bottom: 10px;
}
.diary textarea {
  width: 100%;
  min-height: 74px;
  background: var(--ink0);
  color: var(--tx);
  border: 1px solid var(--ink2);
  font-family: inherit;
  font-size: 14.5px;
  line-height: 1.8;
  padding: 10px;
  resize: none;
}
.diary textarea:focus { outline: none; border-color: var(--cyan); }
.diary .dnote {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--tx-dim);
  margin-top: 7px;
}

/* ---------- 調査ウィジェット ---------- */

.logrow {
  display: flex;
  gap: 12px;
  width: 100%;
  font-family: var(--mono);
  font-size: 13px;
  text-align: left;
  color: var(--tx);
  background: var(--ink1);
  border: 1px solid var(--ink2);
  padding: 10px 12px;
  cursor: pointer;
}
.logrow:hover, .logrow:focus-visible { border-color: var(--cyan); outline: none; }
.logrow .t { color: var(--cyan); flex: none; font-variant-numeric: tabular-nums; }
.logrow.gray, .logrow.gray .t { color: var(--tx-dim); }
.logrow.hint { border-color: var(--amber); }
.logrow.open { border-color: var(--cyan); }
.logdetail {
  font-family: var(--mono);
  font-size: 12.5px;
  color: var(--tx-dim);
  border-left: 1px solid var(--ink2);
  margin: 2px 0 4px 6px;
  padding: 2px 0 2px 14px;
  white-space: pre-line;
}

.quote {
  border-left: 2px solid var(--ink2);
  padding: 4px 0 4px 14px;
  margin-bottom: 1.1em;
  color: var(--tx);
  font-size: 14px;
}
.quote .who { color: var(--tx-dim); font-size: 11.5px; font-family: var(--mono); margin-bottom: 2px; }

/* ---------- 表紙・終了カード ---------- */

.card {
  min-height: 55vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  gap: 14px;
}
.card .t1 { font-size: 30px; letter-spacing: .3em; text-indent: .3em; }
.card .t2 { font-size: 12.5px; color: var(--tx-dim); letter-spacing: .2em; }
.card .t3 { font-family: var(--mono); font-size: 11px; color: var(--tx-dim); margin-top: 18px; }

/* ---------- 遷移オーバーレイ ---------- */

#fx {
  position: fixed;
  inset: 0;
  background: #000;
  color: #6e6a62;
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: .15em;
  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .45s ease;
  z-index: 50;
}
#fx.on { opacity: 1; pointer-events: all; }

/* ---------- 書庫 ---------- */

#library { flex: 1; min-height: 0; padding: 30px 20px; overflow-y: auto; }
#library h1 {
  font-size: 13px;
  font-family: var(--mono);
  font-weight: normal;
  letter-spacing: .35em;
  color: var(--tx-dim);
  margin-bottom: 26px;
}
.book {
  display: block;
  width: 100%;
  text-align: left;
  font-family: inherit;
  color: var(--tx);
  background: var(--ink1);
  border: 1px solid var(--ink2);
  padding: 20px 18px;
  margin-bottom: 14px;
  cursor: pointer;
  transition: border-color .18s ease;
}
.book:hover, .book:focus-visible { border-color: var(--cyan); outline: none; }
.book .bt { font-size: 19px; letter-spacing: .18em; margin-bottom: 4px; }
.book .bs { font-size: 11.5px; color: var(--tx-dim); letter-spacing: .1em; margin-bottom: 10px; }
.book .bd { font-size: 13px; color: var(--tx-dim); line-height: 1.8; }
.book.locked { opacity: .45; cursor: default; }
.book.locked:hover { border-color: var(--ink2); }
.bookbtns { display: flex; gap: 9px; margin-top: 14px; }
.bookbtns .ch { flex: 1; text-align: center; }

/* ---------- 壁打ちモード ---------- */

body.mode-kabe { background: var(--kabe-bg); color: var(--kabe-tx); }
body.mode-kabe #hud { opacity: 0; }
body.mode-kabe #flow { font-family: var(--mono); font-size: 14px; letter-spacing: .05em; }
body.mode-kabe .line.nar { color: var(--kabe-dim); }
body.mode-kabe .line.say { color: var(--kabe-tx); }
body.mode-kabe .line.sys {
  color: var(--kabe-tx);
  background: transparent;
  border: none;
  border-left: 1px solid var(--kabe-dim);
  padding: 2px 0 2px 13px;
  font-size: 14px;
}
body.mode-kabe .line.me {
  color: var(--kabe-tx);
  border-right: 1px solid var(--kabe-dim);
  padding: 2px 13px 2px 0;
  font-family: var(--mono);
}
body.mode-kabe button.ch {
  background: transparent;
  border: 1px solid #2a2824;
  color: var(--kabe-tx);
  font-family: var(--mono);
  font-size: 13.5px;
}
body.mode-kabe button.ch:hover, body.mode-kabe button.ch:focus-visible { border-color: var(--kabe-tx); }

/* ---------- 素モード（幕間） ---------- */

body.mode-plain { background: #0a0a0c; color: #b9b4ac; }
body.mode-plain #hud { opacity: 0; }
body.mode-plain .line.nar { color: #b9b4ac; }

/* ---------- その他 ---------- */

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

</style>
</head>
<body class="mode-kiko">
<div id="app">
  <header id="hud">
    <span>社会発達支援機構 ─ 統合端末</span>
    <span class="obs">観測中</span>
  </header>
  <main id="stage">
    <div id="library"></div>
    <div id="game" hidden>
      <div id="flow"></div>
      <div id="controls"></div>
    </div>
  </main>
</div>
<div id="fx"></div>
<script>
/* 没入書庫 エンジン（作品非依存）
   シナリオは NG.register({...}) で登録する。 */

window.NG = (function () {
  "use strict";

  /* ---------- 保存（localStorage 不可の環境ではメモリに退避） ---------- */
  var mem = {};
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return mem[k] || null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) { delete mem[k]; } }
  };

  var reduced = false;
  try { reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}

  /* ---------- 状態 ---------- */
  var scenarios = {};
  var cur = null;          // 実行中シナリオ
  var nodeId = null;
  var typing = null;       // {skip:bool}
  var tapResolver = null;
  var busy = false;

  var T = null;            // テレメトリ

  function resetTelemetry() {
    T = { start: Date.now(), choices: [], diaries: [], hints: 0 };
  }

  /* ---------- DOM ---------- */
  function $(id) { return document.getElementById(id); }
  var flow, controls, fx, hud;

  function scrollDown() { flow.scrollTop = flow.scrollHeight; }

  function clearFlow() { flow.innerHTML = ""; }
  function clearControls() { controls.innerHTML = ""; }

  /* ---------- 行の描画 ---------- */
  function clsFor(t) {
    if (t.charAt(0) === "【") return "sys";
    if (t.charAt(0) === "「" || t.charAt(0) === "『") return "say";
    return "nar";
  }

  function addLineNow(text, cls) {
    var d = document.createElement("div");
    d.className = "line " + (cls || clsFor(text));
    d.textContent = text;
    flow.appendChild(d);
    scrollDown();
    return d;
  }

  function typeLine(text, cls) {
    return new Promise(function (res) {
      var d = document.createElement("div");
      d.className = "line " + (cls || clsFor(text));
      flow.appendChild(d);
      if (reduced) { d.textContent = text; scrollDown(); res(); return; }
      var i = 0;
      typing = { skip: false };
      var iv = setInterval(function () {
        if (typing && typing.skip) {
          d.textContent = text;
          clearInterval(iv); typing = null; scrollDown(); res(); return;
        }
        i += 1;
        d.textContent = text.slice(0, i);
        if (i % 6 === 0) scrollDown();
        if (i >= text.length) { clearInterval(iv); typing = null; scrollDown(); res(); }
      }, 26);
    });
  }

  function waitTap() {
    return new Promise(function (res) {
      var cue = document.createElement("div");
      cue.className = "cue";
      cue.textContent = "▼";
      flow.appendChild(cue);
      scrollDown();
      tapResolver = function () { cue.remove(); res(); };
    });
  }

  function onTap() {
    if (typing) { typing.skip = true; return; }
    if (tapResolver) { var r = tapResolver; tapResolver = null; r(); }
  }

  async function playLines(lines) {
    for (var i = 0; i < lines.length; i++) {
      var ln = lines[i];
      var text = (typeof ln === "string") ? ln : ln.t;
      var cls = (typeof ln === "string") ? null : ln.c;
      await typeLine(text, cls);
      if (i < lines.length - 1) await waitTap();
    }
  }

  /* ---------- モード遷移 ---------- */
  var mode = null;
  function setModeInstant(m) {
    mode = m;
    document.body.className = "mode-" + m;
  }
  function transition(m, msg) {
    return new Promise(function (res) {
      if (mode === m) { res(); return; }
      if (reduced) { setModeInstant(m); res(); return; }
      fx.textContent = msg || "";
      fx.classList.add("on");
      setTimeout(function () {
        setModeInstant(m);
        clearFlow();
        setTimeout(function () {
          fx.classList.remove("on");
          res();
        }, 500);
      }, msg ? 1150 : 400);
    });
  }
  var FXMSG = {
    kabe: "未登録網に接続しています ……",
    kiko: "機構統合端末に再接続しています ……",
    plain: ""
  };

  /* ---------- ノード実行 ---------- */
  async function runNode(id) {
    var n = cur.nodes[id];
    if (!n) { addLineNow("【シナリオエラー: ノード " + id + " が見つかりません】", "sys"); return; }
    nodeId = id;
    if (!n.noSave) store.set("ng-pos", JSON.stringify({ s: cur.id, n: id }));

    clearControls();
    if (n.mode && n.mode !== mode) await transition(n.mode, FXMSG[n.mode]);
    if (n.clear) clearFlow();

    var fn = types[n.type || "text"];
    await fn(n);
  }

  function choiceButtons(list, onPick) {
    var t0 = performance.now();
    list.forEach(function (c) {
      var b = document.createElement("button");
      b.className = "ch";
      b.textContent = c.label;
      b.onclick = function () {
        if (busy) return;
        busy = true;
        clearControls();
        var ms = performance.now() - t0;
        onPick(c, ms).then(function () { busy = false; });
      };
      controls.appendChild(b);
    });
  }

  var types = {

    /* 表紙 */
    title: async function (n) {
      var card = document.createElement("div");
      card.className = "card";
      card.innerHTML =
        '<div class="t2">' + esc(n.sub || "") + "</div>" +
        '<div class="t1">' + esc(n.t) + "</div>" +
        '<div class="t3">' + esc(n.note || "") + "</div>";
      flow.appendChild(card);
      choiceButtons([{ label: n.button || "開く", next: n.next }], async function (c) {
        await runNode(c.next);
      });
    },

    /* 地の文 */
    text: async function (n) {
      await playLines(n.lines);
      if (n.next) { await waitTap(); await runNode(n.next); }
    },

    /* 選択肢（reply でラリーにも使う） */
    choice: async function (n) {
      await playLines(n.lines || []);
      choiceButtons(n.choices, async function (c, ms) {
        T.choices.push({ node: nodeId, label: c.label, ms: Math.round(ms) });
        if (!c.silent) addLineNow(c.label, "me");
        if (c.reply) { await playLines(c.reply); }
        await waitTap();
        await runNode(c.next || n.next);
      });
    },

    /* 情動ログ入力 */
    diary: async function (n) {
      await playLines(n.lines || []);
      var t0 = performance.now();
      var box = document.createElement("div");
      box.className = "diary";
      box.innerHTML =
        '<div class="dlabel">' + esc(n.label || "【本日の情動ログを提出してください】") + "</div>" +
        '<textarea spellcheck="false"></textarea>' +
        '<div class="dnote">推奨文が入力されています。このまま提出できます。</div>';
      var ta = box.querySelector("textarea");
      ta.value = n.suggest;
      controls.appendChild(box);
      var b = document.createElement("button");
      b.className = "ch";
      b.textContent = "提出";
      b.style.marginTop = "9px";
      controls.appendChild(b);
      await new Promise(function (res) {
        b.onclick = function () {
          var ms = Math.round(performance.now() - t0);
          var edited = ta.value.trim() !== n.suggest.trim();
          T.diaries.push({ node: nodeId, edited: edited, ms: ms });
          clearControls();
          addLineNow("【" + ta.value.trim() + "】", "me");
          addLineNow(edited ? "【提出を受理しました】" : "【提出を受理しました（入力時間 " + (ms / 1000).toFixed(1) + " 秒）】", "sys");
          res();
        };
      });
      await waitTap();
      await runNode(n.next);
    },

    /* ログ調査: target の行を開くと先に進める */
    logview: async function (n) {
      await playLines(n.lines || []);
      var opens = 0, found = false;
      var rowEls = {};
      n.items.forEach(function (it) {
        var b = document.createElement("button");
        b.className = "logrow" + (it.gray ? " gray" : "");
        rowEls[it.key] = b;
        b.innerHTML = '<span class="t">' + esc(it.time) + "</span><span>" + esc(it.label) + "</span>";
        var det = null;
        b.onclick = function () {
          if (det) { det.remove(); det = null; b.classList.remove("open"); return; }
          det = document.createElement("div");
          det.className = "logdetail";
          det.textContent = it.d;
          b.after(det);
          b.classList.add("open");
          if (it.key === n.target && !found) {
            found = true;
            var go = document.createElement("button");
            go.className = "ch";
            go.style.marginTop = "9px";
            go.textContent = n.goLabel || "この空白を調べる";
            go.onclick = async function () {
              clearControls();
              await runNode(n.next);
            };
            controls.appendChild(go);
          } else if (!found) {
            opens += 1;
            if (opens === n.hintAfter) {
              T.hints += 1;
              addLineNow(n.hint, "say");
              if (rowEls[n.target]) rowEls[n.target].classList.add("hint");
            }
          }
        };
        controls.appendChild(b);
      });
    },

    /* 証言比較: 正解を選ぶまで問い直す */
    testimony: async function (n) {
      n.quotes.forEach(function (q) {
        var d = document.createElement("div");
        d.className = "quote";
        d.innerHTML = '<div class="who">' + esc(q.who) + "</div>" + esc(q.t);
        flow.appendChild(d);
      });
      scrollDown();
      await playLines(n.lines || []);
      var attempts = 0;
      var ask = function () {
        choiceButtons(n.choices, async function (c, ms) {
          T.choices.push({ node: nodeId, label: c.label, ms: Math.round(ms) });
          addLineNow(c.label, "me");
          if (c.ok) {
            await waitTap();
            await runNode(n.next);
          } else {
            attempts += 1;
            await playLines(c.reply);
            ask();
          }
        });
      };
      ask();
    },

    /* プレイヤー観測記録の開示 */
    stats: async function (n) {
      var secs = Math.round((Date.now() - T.start) / 1000);
      var mm = Math.floor(secs / 60), ss = secs % 60;
      var cs = T.choices;
      var avg = cs.length ? cs.reduce(function (a, c) { return a + c.ms; }, 0) / cs.length / 1000 : 0;
      var fastest = cs.length ? Math.min.apply(null, cs.map(function (c) { return c.ms; })) / 1000 : 0;
      var edited = T.diaries.filter(function (d) { return d.edited; }).length;
      var report = [
        "【例外事案調査報告 ―― 対象: あなた】",
        "【プレイ時間: " + mm + "分" + ss + "秒】",
        "【選択回数: " + cs.length + "回 ／ 平均決断時間: " + avg.toFixed(1) + "秒 ／ 最速: " + fastest.toFixed(1) + "秒】",
        "【情動ログ: " + T.diaries.length + "件提出 ―― うち、手で書き直した夜: " + edited + "件】",
        "【ヒント使用: " + T.hints + "回】"
      ];
      await playLines(report);
      await waitTap();
      await playLines(n.lines || []);
      choiceButtons(n.choices, async function (c, ms) {
        addLineNow(c.label, "me");
        if (c.erase) {
          store.del("ng-pos");
          store.del("ng-telem");
          resetTelemetry();
        }
        await playLines(c.reply || []);
        await waitTap();
        await runNode(c.next || n.next);
      });
    },

    /* 終了カード */
    end: async function (n) {
      await playLines(n.lines || []);
      store.del("ng-pos");
      choiceButtons([{ label: n.button || "書庫に戻る" }], async function () {
        location.reload();
      });
    }
  };

  function esc(s) {

<script>
/* 没入書庫 起動処理・書庫画面 */

(function () {
  "use strict";

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function buildLibrary() {
    var lib = document.getElementById("library");
    var saved = NG.savedPos();
    var html = "<h1>没 入 書 庫</h1>";
    lib.innerHTML = html;

    Object.keys(NG.scenarios).forEach(function (id) {
      var s = NG.scenarios[id];
      var card = document.createElement("div");
      card.className = "book";
      card.innerHTML =
        '<div class="bt">' + esc(s.title) + "</div>" +
        '<div class="bs">' + esc(s.sub || "") + "</div>" +
        '<div class="bd">' + esc(s.desc || "") + "</div>" +
        '<div class="bookbtns"></div>';
      var btns = card.querySelector(".bookbtns");

      var startBtn = document.createElement("button");
      startBtn.className = "ch";
      startBtn.textContent = "はじめから";
      startBtn.onclick = function (e) {
        e.stopPropagation();
        NG.clearSave();
        NG.start(id);
      };
      btns.appendChild(startBtn);

      if (saved && saved.s === id) {
        var contBtn = document.createElement("button");
        contBtn.className = "ch";
        contBtn.textContent = "続きから";
        contBtn.onclick = function (e) {
          e.stopPropagation();
          NG.start(id, saved.n);
        };
        btns.appendChild(contBtn);
      }
      lib.appendChild(card);
    });

    var locked = document.createElement("div");
    locked.className = "book locked";
    locked.innerHTML =
      '<div class="bt">――</div>' +
      '<div class="bs">準備中</div>' +
      '<div class="bd">次の物語が、ここに並ぶ。</div>';
    lib.appendChild(locked);
  }

  function init() {
    NG.boot();
    buildLibrary();
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();

</script>
